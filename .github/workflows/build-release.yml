name: Build and Release APK

on:
  push:
    branches:
      - main
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      version:
        description: 'Version tag for release (e.g., v2.0.0)'
        required: true
        default: 'v2.0.7'

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          submodules: false

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          build-scan-publish: true
          build-scan-terms-of-use-url: "https://gradle.com/terms-of-service"
          build-scan-terms-of-use-agree: "yes"

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Build Release APK
        run: ./gradlew assembleRelease --scan --stacktrace

      - name: Upload Build Reports on Failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: build-reports
          path: |
            app/build/reports/

      - name: Get version name
        id: version
        run: |
          if [ "${{ github.event_name }}" == "workflow_dispatch" ]; then
            echo "VERSION=${{ github.event.inputs.version }}" >> $GITHUB_OUTPUT
          elif [[ "${GITHUB_REF}" == refs/tags/* ]]; then
            echo "VERSION=${GITHUB_REF#refs/tags/}" >> $GITHUB_OUTPUT
          else
            echo "VERSION=v2.0.7-ci-${GITHUB_SHA::7}" >> $GITHUB_OUTPUT
          fi

      - name: Sign APK with Release Key
        if: ${{ env.SIGNING_KEY != '' }}
        uses: r0adkll/sign-android-release@v1
        id: sign_app
        with:
          releaseDirectory: app/build/outputs/apk/release
          signingKeyBase64: ${{ secrets.SIGNING_KEY }}
          alias: ${{ secrets.KEY_ALIAS }}
          keyStorePassword: ${{ secrets.KEY_STORE_PASSWORD }}
          keyPassword: ${{ secrets.KEY_PASSWORD }}
        env:
          SIGNING_KEY: ${{ secrets.SIGNING_KEY }}
          BUILD_TOOLS_VERSION: "34.0.0"

      - name: Prepare and Rename APK
        run: |
          mkdir -p app/build/outputs/apk/release
          if [ -n "${{ steps.sign_app.outputs.signedReleaseFile }}" ] && [ -f "${{ steps.sign_app.outputs.signedReleaseFile }}" ]; then
            cp "${{ steps.sign_app.outputs.signedReleaseFile }}" app/build/outputs/apk/release/BruhPatcher-${{ steps.version.outputs.VERSION }}.apk
          elif [ -f "app/build/outputs/apk/release/app-release.apk" ]; then
            cp app/build/outputs/apk/release/app-release.apk app/build/outputs/apk/release/BruhPatcher-${{ steps.version.outputs.VERSION }}.apk
          elif [ -f "app/build/outputs/apk/release/app-release-unsigned.apk" ]; then
            cp app/build/outputs/apk/release/app-release-unsigned.apk app/build/outputs/apk/release/BruhPatcher-${{ steps.version.outputs.VERSION }}.apk
          else
            APK_FILE=$(find app/build/outputs/apk -name "*.apk" | head -n 1)
            if [ -n "$APK_FILE" ]; then
              cp "$APK_FILE" app/build/outputs/apk/release/BruhPatcher-${{ steps.version.outputs.VERSION }}.apk
            else
              echo "Error: No APK file found in build outputs!"
              exit 1
            fi
          fi
          echo "[+] Final APK ready: app/build/outputs/apk/release/BruhPatcher-${{ steps.version.outputs.VERSION }}.apk"
          cp "app/build/outputs/apk/release/BruhPatcher-${{ steps.version.outputs.VERSION }}.apk" app/build/outputs/apk/release/BruhPatcher.apk
          ls -la app/build/outputs/apk/release/

      - name: Publish Direct APK Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ startsWith(github.ref, 'refs/tags/') && steps.version.outputs.VERSION || 'latest' }}
          name: ${{ startsWith(github.ref, 'refs/tags/') && format('Bruh Patcher {0}', steps.version.outputs.VERSION) || 'Bruh Patcher Latest Release' }}
          body: |
            ## Bruh Patcher ${{ steps.version.outputs.VERSION }}
            
            ### Direct Download (No ZIP)
            👉 **Direct APK:** [BruhPatcher.apk](https://github.com/nothingnesscore/BruhPatcher/releases/download/${{ startsWith(github.ref, 'refs/tags/') && steps.version.outputs.VERSION || 'latest' }}/BruhPatcher.apk)
            
            ### What's New
            - Built from commit ${{ github.sha }}
            - **Permanent Release Signature (Seamless In-Place Updates)**: Release APKs are now signed with the permanent project release keystore (V1, V2, V3, and V4 signing schemes). No more signature mismatch errors (`INSTALL_FAILED_UPDATE_INCOMPATIBLE`) when installing new versions over older builds.
            - **HyperOS Based Patching Logo & Alive UI Theme**: High-tech HyperOS adaptive launcher icon (obsidian superellipse, glowing cyan `#00F0FF` / electric blue `#1677FF` nexus) and rich in-app branding across Dashboard and Settings.
            - **Self-Contained Standalone Binaries**: Bundled standalone `zip`, `zipalign`, `aapt`, `bash`, and `busybox` binaries across `arm64-v8a`, `armeabi-v7a`, `x86_64`, `x86` with automatic multi-path discovery and `aapt add` fallback.
            - **NoMount VFS Engine Compatibility**: Generated modules are 100% compatible with NoMount (`maxsteeel/nomount` & `Bouteillepleine/NoMount-Suite`) VFS path redirection.
            - **NoMount Auto-Recovery & Guard Re-arming**: Automatically detects tripped NoMount metamodules on flash with 1-tap reset.
            - **Universal Android Framework Patcher**: Full support from Android 8.0 through Android 17 (Baklava / API 37) and HyperOS 1-4.
            - Direct `.apk` file distribution (never inside a `.zip`)
            - 1-Tap Diagnostic & Stacktrace feedback reporting for instant issue fixing
            - Live Keybox Hub synchronization from `https://keybox.hzzmonet.io.vn`
            - Universal Android Framework Patcher (Android 8.0 - 17, HyperOS 1-4, MIUI, AOSP, OneUI, ColorOS)
            - MIUIX Liquid Glass Floating Dock with dynamic contrast and light refraction
            - Integrated Kaorios Toolbox v2.0.6.0 with Play Integrity Fix and hardware Keybox attestation
            
            ### Installation
            1. Download `BruhPatcher.apk` directly from Assets below (no unzipping needed).
            2. Install on your rooted Android device.
            3. Grant root permissions when prompted.
          files: |
            app/build/outputs/apk/release/BruhPatcher.apk
            app/build/outputs/apk/release/BruhPatcher-${{ steps.version.outputs.VERSION }}.apk
          draft: false
          prerelease: false
          make_latest: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload APK as Artifact
        uses: actions/upload-artifact@v4
        with:
          name: BruhPatcher-APK
          path: app/build/outputs/apk/release/BruhPatcher-${{ steps.version.outputs.VERSION }}.apk
